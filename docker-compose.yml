version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: bienestar_db
    restart: always
    environment:
      POSTGRES_USER: admin_salud
      POSTGRES_PASSWORD: password_seguro_huanuco
      POSTGRES_DB: bienestar_social_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

